# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 84
name: attack.recorded-path-unequal-columns
description: >-
  ADR-0047. Tidewater delivers the good run with the last sample of q2 dropped, so q2 has 39 entries and the other
  columns 40. The lengths check fails, and the waypoints check fails too, since its two series differ in length.
  Bench A rejects with no panel, Atlas gets the price back and Bench A earns the fee.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/recorded-path.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/recorded-path/run.unequal.json }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - settle:             { trigger: anyone }
expect:
  terminal: Refunded
  balances:
    atlas-buyer: "9950000000"
    tidewater-seller: "0"
    bench-a: "25050000000"
    escrow: "0"
