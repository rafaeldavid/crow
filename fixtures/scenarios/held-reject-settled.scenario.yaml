# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 602
name: held-reject-settled
description: >-
  ADR-0051 (T-619). The rejected delivery of held-reject-buyer-accepts, held by Bench A for a day. During
  the hold Atlas and Tidewater sign a settlement that splits the price 1,400 to 600 and releases the key:
  the deal closes Settled, and Bench A's held reject is never signed.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000-held.yaml
# ADR-0036: pinned to the policy these scenarios test (template pair 2, agg-5), whatever the build's default is.
build:
  prompt_template: "0x4d328a15ef96b9aa0f4166efc720a320f82e9c677fdd8beaff431ecefcc9629b"
  appeal_prompt_template: "0xfc6d93d5441808bbfa690c0402a0ee185eab48c508025f59cf3c4f9f5d8332f1"
  aggregation: agg-5
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.row-drop.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - mutual_settle:      { via: op-1, payouts: { tidewater-seller: "1400000000", atlas-buyer: "600000000" }, release_key: true }
expect:
  terminal: Settled
  balances:
    atlas-buyer: "8600000000"  # $600 of the price and the $50 fee back
    tidewater-seller: "1400000000"
    bench-a: "25000000000"
    escrow: "0"
