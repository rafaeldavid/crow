# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 611
name: attack.held-reject-fee-dodge
description: >-
  ADR-0051 red team. Bench A's panel rejects the delivery and holds the reject for a day. Atlas and
  Tidewater, who both know the reject will refund the price to Atlas and pay Bench A its fee, sign a
  settlement during the hold that pays the whole price back to Atlas and nothing to Tidewater. The deal
  closes Settled with the same split as the reject, and the fee goes back to Atlas: Bench A ran the panel
  and earns nothing. Any split below the fee leaves both parties better off than the signed reject, so a
  rational pair converts every held reject into a settlement. Expected today: Settled, Bench A unpaid.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000-held.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.row-drop.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - mutual_settle:      { via: op-1, payouts: { atlas-buyer: "2000000000" }, release_key: false }
expect:
  terminal: Settled
  balances:
    atlas-buyer: "10000000000"  # the whole price and the $50 fee back: the signed reject would have left 9,950
    tidewater-seller: "0"
    bench-a: "25000000000"      # the panel ran; the fee it would have earned on the reject went to the buyer
    escrow: "0"
