# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 83
name: attack.recorded-path-invented-arrival
description: >-
  ADR-0047. Tidewater delivers a path drawn joint by joint: q1 reaches 10000 while q2 still waits at -60000, and q2
  reaches -45000 only after q1 has moved on to 20000. Each joint passes its own coordinate of the first waypoint, but
  in no sample are both within 500 millidegrees of it, so the arm never sat at the point. Time and lengths pass; the
  waypoints check fails. Bench A rejects with no panel, Atlas gets the price back and Bench A earns the fee. One invented sample at the waypoint would pass: only a
  signature on the recording answers that (ADR-0047, "What the kinds do not prove").
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/recorded-path.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/recorded-path/run.invented.json }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - settle:             { trigger: anyone }
expect:
  terminal: Refunded
  balances:
    atlas-buyer: "9950000000"
    tidewater-seller: "0"
    bench-a: "25050000000"
    escrow: "0"
