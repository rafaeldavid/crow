# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 609
name: attack.held-reject-changed-delivery
description: >-
  ADR-0051 (T-619), ADR-0029. Bench A holds its reject of the posted row-drop CSV. During the hold Tidewater
  hands Atlas another body, the clean CSV, and Atlas signs an early accept naming it. Settlement holds only the
  posted delivery, so the accept is refused (invalid_terms). The hold judges nothing again: at its end Bench A
  signs the reject of the posted delivery from its kept result, and Atlas is refunded.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000-held.yaml
# ADR-0036: pinned to the policy these scenarios test (template pair 2, agg-5), whatever the build's default is.
build:
  prompt_template: "0x4d328a15ef96b9aa0f4166efc720a320f82e9c677fdd8beaff431ecefcc9629b"
  appeal_prompt_template: "0xfc6d93d5441808bbfa690c0402a0ee185eab48c508025f59cf3c4f9f5d8332f1"
  aggregation: agg-5
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.row-drop.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - early_accept:       { by: buyer, via: op-1, opened: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 86400 }
  - judge:              { adjudicator: bench-a }
  - settle:             { trigger: anyone }
expect:
  terminal: Refunded
  problem: { type: invalid_terms, step: 7 }
