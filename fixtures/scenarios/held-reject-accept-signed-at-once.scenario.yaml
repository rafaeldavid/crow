# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 605
name: held-reject-accept-signed-at-once
description: >-
  ADR-0051 (T-619). A rubric deal with judgeWithinSec 87,000 s whose panel passes the clean CSV: the hold
  applies to a reject only, so Bench A signs the accept at once and Tidewater is paid. Named without the
  attack. prefix because an attack fixture may not end in a first-instance accept.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000-held.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - settle:             { trigger: anyone }
  - verify_key_release: { by: buyer, via: op-1 }
expect:
  terminal: Released
