# T-576: known findings the dependency scan (.github/workflows/dependency-scan.yml) lets through for this folder's
# Cargo.lock only. osv-scanner reads the osv-scanner.toml beside each lockfile it scans, so these entries cover no
# other lockfile; methods/guest/ has its own file. tools/envelope-proof is a research prototype (T-541), part of
# nothing deployed, stopped where it is by Rafa on 2026-11-19. Each entry ends on 2027-01-18, when the scan asks again.
# None can be fixed by a bump: each fixed version, where one exists, is outside a range that risc0-zkvm 3.1.0's own
# dependencies pin, and moving risc0-zkvm to a new major version changes the guest's image ID and needs a new proof.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-01-18
reason = "2026-11-19: rsa 0.9.10, Marvin timing side channel on RSA private-key operations; fixed in 0.10.0. Cannot move: rzup 0.5.2 requires rsa ^0.9, and risc0-zkvm 3.1.0 requires rzup ^0.5.2. Not reachable (inferred): rzup uses rsa to sign and verify its own toolchain downloads (src/distribution/signature.rs), and the prototype holds no RSA private key."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0055"
ignoreUntil = 2027-01-18
reason = "2026-11-19: tracing-subscriber 0.2.25, log poisoning with ANSI escapes when it logs untrusted input; fixed in 0.3.20. Cannot move: ark-relations 0.5.1 requires ^0.2, through ark-groth16 0.5.0 and risc0-groth16 3.0.6 to risc0-zkvm 3.1.0. Not reachable (inferred): it serves ark-relations' constraint tracing in Groth16 wrapping, and the prototype proves succinct receipts only (ProverOpts::succinct(), host/src/main.rs) and installs no tracing subscriber."

[[IgnoredVulns]]
id = "GHSA-xwfj-jgwm-7wp5"
ignoreUntil = 2027-01-18
reason = "2026-11-19: the GitHub ID of RUSTSEC-2025-0055 (CVE-2025-58160), the same tracing-subscriber 0.2.25 finding; same reason as that entry."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
ignoreUntil = 2027-01-18
reason = "2026-11-19: bincode 1.3.3 is unmaintained; an informational notice with no vulnerability and no fixed version. The host uses it directly to write and read its own receipt files, and risc0-zkvm 3.1.0 depends on it too. A replacement means a new receipt format for a stopped prototype."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-01-18
reason = "2026-11-19: chrono 0.4.45 is unmaintained; an informational notice with no fixed version. Not built (measured): serde_with names it as an optional dependency, and cargo tree -i chrono --target all -e all finds it in no target's build graph."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
ignoreUntil = 2027-01-18
reason = "2026-11-19: derivative 2.2.0 is unmaintained; an informational notice with no fixed version. A compile-time derive macro only (proc-macro), from ark-crypto-primitives 0.5.0 through risc0-groth16 3.0.6 to risc0-zkvm 3.1.0; no code of it runs in the prover or the verifier."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-01-18
reason = "2026-11-19: paste 1.0.15 is unmaintained; an informational notice with no fixed version. A compile-time macro only (proc-macro), from ark-ff 0.5.0 through risc0-groth16 3.0.6 to risc0-zkvm 3.1.0; no code of it runs in the prover or the verifier."
