[package]
name = "envelope-guest"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }
envelope-statement = { path = "../../statement" }
crypto_box = { version = "0.9", default-features = false, features = ["salsa20", "alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2", features = ["keccak"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
