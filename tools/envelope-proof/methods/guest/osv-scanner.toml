# T-576: known findings the dependency scan (.github/workflows/dependency-scan.yml) lets through for this folder's
# Cargo.lock only, the guest program's. osv-scanner reads the osv-scanner.toml beside each lockfile it scans, so these
# entries cover no other lockfile. The host's lockfile has its own file in tools/envelope-proof/, with the same
# reasons at more length. tools/envelope-proof is a research prototype (T-541), part of nothing deployed, stopped where
# it is by Rafa on 2026-11-19. Each entry ends on 2027-01-18, when the scan asks again.
# The scan reports the tracing-subscriber finding under its GHSA ID, so the GHSA entry is the one that matches and the
# RUSTSEC entry shows as unused (measured, PR 725's scan). Both stay, in case the advisory database changes which ID
# it reports.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0055"
ignoreUntil = 2027-01-18
reason = "2026-11-19: tracing-subscriber 0.2.25, log poisoning with ANSI escapes; fixed in 0.3.20. Cannot move: ark-relations 0.5.1 requires ^0.2, through ark-groth16 0.5.0 and risc0-groth16 3.0.6 to risc0-zkvm 3.1.0. Not reachable (inferred): ark-relations uses it only in r1cs/trace.rs (ConstraintLayer), under an installed tracing subscriber; the guest runs inside the zkVM, installs none and writes no terminal log."

[[IgnoredVulns]]
